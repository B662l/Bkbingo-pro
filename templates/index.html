<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKBINGO PRO - ቴሌግራም ቢንጎ ጨዋታ</title>
    <!-- Tailwind CSS እና Socket.IO CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nyala&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', 'Nyala', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .card-cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; border-radius: 6px; transition: all 0.2s; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <!-- ፕላትፎርም ሄደር -->
    <header class="w-full max-w-md bg-slate-800 p-4 rounded-2xl shadow-lg flex justify-between items-center mb-4 border border-slate-700">
        <div>
            <h1 class="text-xl font-bold text-yellow-400">🔥 BKBINGO PRO</h1>
            <p class="text-xs text-slate-400">ፈጣን እና አስተማማኝ ቢንጎ</p>
        </div>
        <div class="text-right">
            <span class="text-xs text-slate-400 block">ባላንስ (Balance)</span>
            <span id="user-balance" class="text-lg font-bold text-green-400">0.00 ETB</span>
        </div>
    </header>

    <!-- የጨዋታ ሁኔታ እና ታይምር -->
    <div class="w-full max-w-md bg-slate-800 p-4 rounded-2xl shadow-lg mb-4 text-center border border-slate-700">
        <div id="game-status-text" class="text-yellow-400 font-semibold mb-2">ጨዋታው ሊጀመር በመጠበቅ ላይ...</div>
        <div class="flex justify-around items-center">
            <div>
                <span class="text-xs text-slate-400 block">ቀሪ ሰዓት</span>
                <span id="timer-display" class="text-2xl font-bold text-white">15</span> ሰር
            </div>
            <div>
                <span class="text-xs text-slate-400 block">የያዙት ደረሻ (Prize)</span>
                <span id="derash-display" class="text-2xl font-bold text-yellow-400">0.00 ETB</span>
            </div>
        </div>
    </div>

    <!-- የወጡ ቁጥሮች ማሳያ -->
    <div class="w-full max-w-md bg-slate-800 p-4 rounded-2xl shadow-lg mb-4 text-center border border-slate-700">
        <span class="text-xs text-slate-400 block mb-1">የወጣው የቅርብ ጊዜ ቁጥር</span>
        <div id="current-ball" class="text-4xl font-extrabold text-indigo-400 mb-2">-</div>
    </div>

    <!-- የካርቴላ መምረጫ ክፍል -->
    <div class="w-full max-w-md bg-slate-800 p-4 rounded-2xl shadow-lg mb-4 border border-slate-700">
        <h2 class="text-sm font-semibold mb-3 text-slate-300">ካርቴላ ይምረጡ (እስከ 2)</h2>
        <div class="grid grid-cols-5 gap-2" id="cards-container">
            <!-- በጃቫስክሪፕት የሚሞላ -->
        </div>
    </div>

    <!-- ጂኤስ (JavaScript) ሎጂክ -->
    <script>
        const socket = io();
        let userId = 12345; // በቴሌግራም ዌብአፕ ጊዜ ከ Telegram WebApp API ይነበባል

        socket.on('connect', () => {
            console.log('Connected to server');
            socket.emit('get_user_balance', { user_id: userId });
        });

        socket.on('balance_update', (data) => {
            document.getElementById('user-balance').innerText = `${data.balance.toFixed(2)} ETB`;
        });

        socket.on('timer_update', (data) => {
            document.getElementById('timer-display').innerText = data.time_left;
            document.getElementById('game-status-text').innerText = "⏳ ተጫዋቾች ካርቴላ በመግዛት ላይ ናቸው...";
        });

        socket.on('game_started', (data) => {
            document.getElementById('game-status-text').innerText = "🎮 ጨዋታው ተጀምሯል! ዕድልዎን ይከታተሉ...";
            document.getElementById('derash-display').innerText = `${data.derash.toFixed(2)} ETB`;
        });

        socket.on('new_number', (data) => {
            document.getElementById('current-ball').innerText = data.display;
        });

        socket.on('reset_game', () => {
            document.getElementById('game-status-text').innerText = "🔄 አዲስ ዙር እየተዘጋጀ ነው...";
            document.getElementById('current-ball').innerText = "-";
        });
    </script>
</body>
</html>
