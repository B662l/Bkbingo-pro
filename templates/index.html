<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bkbingo pro - ቢንጎ ጨዋታ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding-bottom: 70px; }
        
        /* Header */
        .header { background: #1e1e1e; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .logo { font-size: 20px; font-weight: bold; color: #2ecc71; }
        .user-balance { background: #2c3e50; padding: 8px 15px; border-radius: 20px; font-size: 14px; color: #f39c12; cursor: pointer; }

        /* Action Buttons (Deposit / Withdraw) */
        .action-buttons { display: flex; gap: 10px; padding: 15px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; text-align: center; }
        .btn-deposit { background-color: #2ecc71; color: #fff; }
        .btn-withdraw { background-color: #2c3e50; color: #fff; border: 1px solid #444; }

        /* Main Game Area */
        .game-container { padding: 15px; text-align: center; }
        .current-number { font-size: 32px; color: #2ecc71; margin: 15px 0; font-weight: bold; background: #1e1e1e; padding: 15px; border-radius: 12px; border: 1px solid #333; }
        
        .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 450px; margin: 0 auto; }
        .cell { background: #1e1e1e; border: 1px solid #333; padding: 18px 0; font-size: 18px; border-radius: 8px; cursor: pointer; transition: 0.2s; color: #fff; }
        .cell.selected { background: #2ecc71; color: #121212; font-weight: bold; transform: scale(1.05); }

        /* Profile Sidebar / Modal */
        .sidebar { position: fixed; top: 0; right: -300px; width: 300px; height: 100%; background: #1a1a1a; box-shadow: -5px 0 15px rgba(0,0,0,0.7); transition: 0.3s; z-index: 1000; padding: 20px; border-left: 1px solid #333; }
        .sidebar.open { right: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
        
        .profile-info { display: flex; align-items: center; gap: 12px; background: #2c3e50; padding: 12px; border-radius: 10px; margin-bottom: 20px; }
        .profile-avatar { width: 45px; height: 45px; background: #1abc9c; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        .menu-list { list-style: none; }
        .menu-item { padding: 14px 0; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: #ccc; font-size: 15px; }
        .menu-item:hover { color: #2ecc71; }
        .menu-item.logout { color: #e74c3c; margin-top: 20px; border: none; font-weight: bold; }

        /* Bottom Navigation Bar */
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #181818; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; z-index: 999; }
        .nav-item { text-align: center; color: #aaa; font-size: 12px; cursor: pointer; text-decoration: none; background: none; border: none; }
        .nav-item.active { color: #2ecc71; }
        .nav-item div { font-size: 18px; margin-bottom: 3px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo">bkbingo pro</div>
        <div class="user-balance" onclick="toggleProfile()">ብር 0.00 👤</div>
    </div>

    <!-- Deposit & Withdraw Buttons -->
    <div class="action-buttons">
        <button class="btn btn-deposit" onclick="alert('የክፍያ (Deposit) ገጽ በቴሌብሪር እና ሲቢኢ ይከፈታል')">Deposit</button>
        <button class="btn btn-withdraw" onclick="alert('የገንዘብ ማውጣት (Withdraw) ጥያቄ')">Withdraw</button>
    </div>

    <!-- Game Display -->
    <div class="game-container">
        <div class="current-number" id="latest-call">የተጠራ ቁጥር: --</div>
        <div class="board" id="bingo-board"></div>
    </div>

    <!-- Profile Sidebar (እንደ Hulusport ሜኑ) -->
    <div class="sidebar" id="profileSidebar">
        <div class="sidebar-header">
            <h3>መግቢያ / አካውንት</h3>
            <button class="close-btn" onclick="toggleProfile()">✕</button>
        </div>
        
        <div class="profile-info">
            <div class="profile-avatar">👤</div>
            <div>
                <div style="font-weight: bold; color: #fff;">ተጠቃሚ</div>
                <div style="font-size: 13px; color: #aaa;">+2519xxxxxxxx</div>
            </div>
        </div>

        <ul class="menu-list">
            <li class="menu-item" onclick="alert('My Profile')"><span>👤 My Profile</span> <span>›</span></li>
            <li class="menu-item" onclick="alert('Wallet')"><span>💳 Wallet</span> <span>›</span></li>
            <li class="menu-item" onclick="alert('Transactions')"><span>🔄 Transactions</span> <span>›</span></li>
            <li class="menu-item" onclick="alert('Bet History')"><span>🕒 Game History</span> <span>›</span></li>
            <li class="menu-item" onclick="alert('Promotions')"><span>🎁 Promotions</span> <span>›</span></li>
            <li class="menu-item logout" onclick="alert('ውጣ (Log Out)')"><span>🚪 Log Out</span></li>
        </ul>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="nav-bar">
        <button class="nav-item active"><div>🏠</div>Home</button>
        <button class="nav-item" onclick="alert('Games')"><div>🎮</div>Games</button>
        <button class="nav-item" onclick="alert('Slip')"><div>📄</div>Slip</button>
        <button class="nav-item" onclick="toggleProfile()"><div>👤</div>Profile</button>
    </div>

    <script>
        const socket = io();

        socket.on('connect', () => {
            console.log('ከዌብሶኬት ጋር ተገናኝቷል!');
        });

        socket.on('number_called', (data) => {
            document.getElementById('latest-call').innerText = `የተጠራ ቁጥር: ${data.number}`;
        });

        // Generate Bingo Board
        const board = document.getElementById('bingo-board');
        for (let i = 1; i <= 25; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.innerText = i;
            cell.onclick = () => cell.classList.toggle('selected');
            board.appendChild(cell);
        }

        // Toggle Profile Sidebar
        function toggleProfile() {
            const sidebar = document.getElementById('profileSidebar');
            sidebar.classList.toggle('open');
        }
    </script>
</body>
</html>
