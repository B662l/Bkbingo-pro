<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bkbingo pro - ቢንጎ ጨዋታ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #f39c12; }
        .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 400px; margin: 20px auto; }
        .cell { background: #2c3e50; padding: 20px; font-size: 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .cell.selected { background: #e74c3c; color: white; transform: scale(1.05); }
        .current-number { font-size: 40px; color: #2ecc71; margin: 20px 0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>bkbingo pro</h1>
    <div class="current-number" id="latest-call">የተጠራ ቁጥር: --</div>
    
    <div class="board" id="bingo-board">
        <!-- የቢንጎ ሳጥኖች በጃቫስክሪፕት ይሞላሉ -->
    </div>

    <script>
        const socket = io();

        // ዌብሶኬት ሲገናኝ
        socket.on('connect', () => {
            console.log('ከዌብሶኬት ጋር ተገናኝቷል!');
        });

        // አዲስ ቁጥር ሲጠራ
        socket.on('number_called', (data) => {
            document.getElementById('latest-call').innerText = `የተጠራ ቁጥር: ${data.number}`;
        });

        // የቢንጎ ሰሌዳ ማዘጋጀት
        const board = document.getElementById('bingo-board');
        for (let i = 1; i <= 25; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            cell.innerText = i;
            cell.onclick = () => cell.classList.toggle('selected');
            board.appendChild(cell);
        }
    </script>
</body>
</html>
