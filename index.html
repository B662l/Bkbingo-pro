<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKBINGO PRO - ቴሌግራም ቢንጎ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.6.1/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
    <header class="w-full max-w-md bg-slate-800 p-4 rounded-2xl shadow-lg flex justify-between items-center mb-4 border border-slate-700">
        <div>
            <h1 class="text-xl font-bold text-yellow-400">🔥 BKBINGO PRO</h1>
            <p class="text-xs text-slate-400">ፈጣን እና አስተማማኝ ቢንጎ</p>
        </div>
        <div class="text-right">
            <span class="text-xs text-slate-400 block">ባላንስ</span>
            <span id="user-balance" class="text-lg font-bold text-green-400">0.00 ETB</span>
        </div>
    </header>

    <div class="w-full max-w-md bg-slate-800 p-4 rounded-2xl shadow-lg mb-4 text-center border border-slate-700">
        <div id="game-status-text" class="text-yellow-400 font-semibold mb-2">ጨዋታው በመጠበቅ ላይ...</div>
        <div class="text-4xl font-extrabold text-indigo-400 mb-2" id="current-ball">-</div>
    </div>

    <script>
        const socket = io();
        let userId = 12345;
        socket.on('connect', () => { socket.emit('get_user_balance', { user_id: userId }); });
        socket.on('balance_update', (data) => {
            document.getElementById('user-balance').innerText = `${data.balance.toFixed(2)} ETB`;
        });
    </script>
</body>
</html>
